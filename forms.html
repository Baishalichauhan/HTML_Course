<!DOCTYPE html>
<html>
    <head>
        <title>My First Form</title>
    </head>
    </html>
    <body>
        <h1>Students Register Form</h1>

        <form>
            <label>Enter Your Name:</label>
            <input type="text">
            <br><br>

            <label>Enter Your email:</label>
            <input type="email">
            <br><br>

            <label>Enter Your password:</label>
            <input type="password">
            <br><br>

            <label>Enter Your age:</label>
            <input type="age">
            <br><br>

            <label>Enter Date of Birth:</label>
            <input type="date of birth">
            <br><br>
            
            <label>Enter Your  moblie number:</label>
            <input type="tel" name="mobile" placeholder="Enter your digits" maxlength="10">
            <br><br>

            <label>Gender:</label>
            <input type="radio" name="gender" value="Male">
            Male
            <input type="radio" name="gender" value="Female">
            Female
            <input type="radio" name="gender" value="Others">
            Others
            <br><br>

            <label>Hobbies:</label>
            <input type="checkbox" name="Hobbies" value="Reading">
            Reading
            <input type="checkbox" name="Hobbies" value="Dancing">
            Dancing
            <input type="checkbox" name="Hobbies" value="Singing">
            Singing
            <br><br>

            <label>Enter Your Address:</label>
            <br>
            <textarea name="Address"
                      rows="5"
                      cols="30"
                      paceholder="Enter your address">
            </textarea>
            <br><br>

            <label>Upload Your Resume:</label>
            <input type="file" name="resume">
            <br><br>

            <input type="submit" value="Submit">
            <input type="reset"  value="Reset">

        </form>
    </body>
</html>
