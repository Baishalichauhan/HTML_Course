<!DOCTYPE html>
<html>
    <head>
        <title>Iframe and Embed</title>
    </head>
    <body>
        <h1>My Multimedia Webpage</h1>
        <h2>1.Using iframe</h2>

        <iframe width="500"
                heigth="300"
                src="https://www.youtube.com/embed/Y9ozt29tzgs" 
                title="YouTube Video"
                allowfullvideo>
        </iframe>

        <h2>2.Using Embed</h2>
        <embed
            src="Multimedia/myvideo.mp4"
            width="500"
            height="300"
            type="video/mp4">


    </body>
</html>
