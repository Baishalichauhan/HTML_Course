<!DOCTYPE html>
<html>
    <head>
        <title>Attributes</title>
    </head>
    <body>
        <h1>Important Attributes Form</h1>
        <form>
            Name:
            <input type="text" placeholder="Enter your name" required>
            <br><br>

            Age:
            <input type="numbers" min="18" max="60">
            <br><br>

            Moblie number:
            <input type="tel" maxlength="10" placeholder="Enter your name">
            <br><br>

            Course:
            <input type="text" value="Java" readonly>
            <br><br>

            College:
            <input type="text" value="ABC College" disabled>
            <br><br>

            <input type="checkbox" checked> I agree
            <br><br>

            <input type="submit" value="Register">
            <input type="reset" value="clear">
        </form>
    </body>
</html>
