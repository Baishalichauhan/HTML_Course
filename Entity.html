<body>

    <h1>HTML Special Symbols</h1>

    <p>Copyright: &copy; 2026</p>
    <p>Registered: &reg;</p>
    <p>Heart: &hearts;</p>
    <p>Less than: &lt;</p>
    <p>Greater than: &gt;</p>
    <p>Ampersand: &amp;</p>
    <p>Non-breaking space: Hello&nbsp;World</p>
